name: Bug 报告
description: 报告错误或异常
labels: ["bug"]
assignees: ["MetaMikuAI"]
body:
  - type: dropdown
    id: scene
    attributes:
      label: 场景
      options:
        - 单机
        - 联机主机
        - 联机客机
        - 安装或启动
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题
      description: 发生了什么，怎么复现。可附截图或录屏。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 拖入管理工具「导出诊断包」生成的 zip，或 `BepInEx/LogOutput.log`。联机请附主机和客机两份。诊断包含 Windows 用户名和硬件信息。
    validations:
      required: true
