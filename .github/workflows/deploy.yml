name: Deploy server

on:
  workflow_dispatch:
    inputs:
      game_port:
        description: '新实例 TCP 端口（41000–41099，选择未占用端口）'
        required: true
        default: '41015'
      admin_port:
        description: '新实例本机 HTTP 管理端口（42000–42099）'
        required: true
        default: '42015'
      replaces:
        description: '要退役的已登记实例 ID，逗号分隔；- 表示不退役任何实例'
        required: true
        default: '-'

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build:
    name: 编译与测试服务端
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      mod_version: ${{ steps.metadata.outputs.mod_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.303
      - name: 下载并校验编译依赖
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          Invoke-WebRequest https://github.com/MetaMystia/TouhouMystiaIzakaya-deps/releases/download/Release4.4.0e/deps-Release4.4.0e.zip -OutFile .tmp/deps.zip
          if ((Get-FileHash .tmp/deps.zip -Algorithm SHA256).Hash -ne '427951e119e6f0d5547ab36d566d03fe6969c9677e141e6b82b24c62730193d8') {
            throw '编译依赖 SHA-256 不匹配'
          }
          Expand-Archive .tmp/deps.zip -DestinationPath .tmp/deps
          '<Project><PropertyGroup><BepInExPath>$(MSBuildThisFileDirectory).tmp/deps</BepInExPath></PropertyGroup></Project>' |
            Set-Content MetaMystia.local.props -Encoding utf8
          '{"sdk":{"version":"10.0.303","rollForward":"disable"}}' |
            Set-Content global.json -Encoding utf8
      - name: 网络测试
        run: dotnet run --project src/MetaMystia.Network.Tests -c Release
      - name: 流程测试
        run: dotnet run --project src/MetaMystia.Flow.Tests -c Release
      - name: 部署流程测试
        run: dotnet run --project src/MetaMystia.Hosting.Tests -c Release
      - name: 构建 Linux 服务端（包含运行时）
        run: dotnet publish src/MetaMystia.Server/MetaMystia.Server.csproj -c Release -r linux-x64 --self-contained true
      - name: 记录部署版本
        id: metadata
        run: |
          [xml]$versions = Get-Content Versions.props
          $version = $versions.Project.PropertyGroup.Version
          @{ gameVersion = $versions.Project.PropertyGroup.TargetGameVersion; modVersion = $version } |
            ConvertTo-Json | Set-Content src/MetaMystia.Server/bin/Release/net6.0/linux-x64/publish/deployment.json -Encoding utf8NoBOM
          "mod_version=$version" >> $env:GITHUB_OUTPUT
      - name: 构建 Linux 目录服务（包含运行时）
        run: dotnet publish src/MetaMystia.Directory -c Release -r linux-x64 --self-contained true
      - uses: actions/upload-artifact@v7
        with:
          name: directory-linux-x64
          path: src/MetaMystia.Directory/bin/Release/net6.0/linux-x64/publish/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux-x64
          path: src/MetaMystia.Server/bin/Release/net6.0/linux-x64/publish/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: 部署独立实例并登记
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-linux-x64
          path: server
      - name: 上传并部署
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          INSTANCE_ID: v${{ needs.build.outputs.mod_version }}-${{ github.run_id }}
          GAME_PORT: ${{ inputs.game_port }}
          ADMIN_PORT: ${{ inputs.admin_port }}
          REPLACES: ${{ inputs.replaces }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          [[ "$INSTANCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]+$ ]]
          [[ "$GAME_PORT" =~ ^[0-9]+$ && "$ADMIN_PORT" =~ ^[0-9]+$ ]]
          [[ "$REPLACES" =~ ^[A-Za-z0-9._,-]+$ ]]
          (( 10#$GAME_PORT >= 41000 && 10#$GAME_PORT <= 41099 ))
          (( 10#$ADMIN_PORT >= 42000 && 10#$ADMIN_PORT <= 42099 ))
          umask 077
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod +x server/MetaMystia.Server
          tar -czf server.tar.gz -C server .
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "metamystia-cd@$SERVER_HOST" "deploy-instance $INSTANCE_ID $GAME_PORT $ADMIN_PORT $REPLACES" < server.tar.gz
